<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Território Sul</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: hub comercial — trilho lateral de navegação por frentes (território, comercial, inteligência), barra fixa com busca geral e filtro de UF; no celular o trilho vira abas */
:root{
  --paper:#f3f6f5; --surface:#ffffff; --sunk:#e8eeec; --ink:#0f2a2d; --muted:#566b6c; --line:#d6dfdd;
  --accent:#0d6b5f; --accent-soft:#d5ebe6; --signal:#a86a12; --signal-soft:#f6e7cc;
  --pr:#2b5c8a; --sc:#16857a; --rs:#77508a; --gray:#8a9a99; --danger:#a3392f; --shadow:rgba(15,42,45,.14);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1617; --surface:#152123; --sunk:#1b2a2c; --ink:#e3ecea; --muted:#93a7a5; --line:#273a3c;
  --accent:#43b8a2; --accent-soft:#163a35; --signal:#e2a94e; --signal-soft:#3a2c14;
  --pr:#73a2d4; --sc:#4fc3b5; --rs:#b991cf; --gray:#6f8381; --danger:#e07a6e; --shadow:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1617; --surface:#152123; --sunk:#1b2a2c; --ink:#e3ecea; --muted:#93a7a5; --line:#273a3c;
  --accent:#43b8a2; --accent-soft:#163a35; --signal:#e2a94e; --signal-soft:#3a2c14;
  --pr:#73a2d4; --sc:#4fc3b5; --rs:#b991cf; --gray:#6f8381; --danger:#e07a6e; --shadow:rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.5rem;font-weight:700} h3{font-size:1.05rem;font-weight:700} h4{font-size:.98rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(circle at 20% 10%,var(--accent-soft),transparent 45%),var(--paper)}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:18px}
.login-card h1{font-size:1.9rem}
.contour{height:64px;border-radius:8px;background:var(--sunk);overflow:hidden}
.field{display:grid;gap:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.field textarea{min-height:90px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:9px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn.tiny{padding:2px 8px;font-size:.78rem;font-weight:500}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.err{color:var(--danger);font-size:.9rem;min-height:1.2em}

/* shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
aside.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px 16px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.side-brand{display:grid;gap:4px;padding-inline:8px}
.side-brand b{font-family:var(--f-display);font-size:1.3rem}
.navgrp{display:grid;gap:2px}
.navgrp .label{padding:0 10px 4px}
.navbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--ink);text-align:left;font-weight:500}
.navbtn:hover{background:var(--sunk)}
.navbtn[aria-current="page"]{background:var(--ink);color:var(--surface)}
.navbtn .ct{font-family:var(--f-mono);font-size:.74rem;color:inherit;opacity:.65}
.side-foot{margin-top:auto;display:grid;gap:10px;padding-inline:8px}
.body-col{min-width:0}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.m-brand{font-family:var(--f-display);font-size:1.15rem;display:none}
.m-only{display:none}
nav.tabs{display:none;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:7px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--surface)}
@media (max-width:960px){.shell{grid-template-columns:minmax(0,1fr)}aside.side{display:none}.m-brand,.m-only{display:inline-flex}nav.tabs{display:flex}}
.gsearch{position:relative;flex:1 1 280px;min-width:0}
.gsearch input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.gres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px var(--shadow);max-height:min(60vh,460px);overflow-y:auto;z-index:15;padding:6px}
.gres button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer}
.gres button:hover,.gres button:focus-visible{background:var(--sunk)}
.gres .t{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gres .l{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gres .s{display:block;font-weight:400;font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ufsel{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:999px}
.ufsel button{border:0;background:none;padding:5px 11px;border-radius:999px;cursor:pointer;font-family:var(--f-mono);font-size:.82rem}
.ufsel button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px var(--shadow);font-weight:600}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gray);margin-right:6px}
.status-dot.on{background:var(--accent)}

main{padding-block:24px 64px}
section.view{display:grid;gap:20px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.head p{color:var(--muted);max-width:68ch}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0;align-content:start}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.chip.uf-PR{color:var(--pr);border-color:var(--pr)} .chip.uf-SC{color:var(--sc);border-color:var(--sc)} .chip.uf-RS{color:var(--rs);border-color:var(--rs)}
.chip.A,.chip.entrada,.chip.alta,.chip.ganha{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.B,.chip.onda2,.chip.media{background:var(--signal-soft);color:var(--signal);border-color:transparent}
.chip.C,.chip.monitorar,.chip.baixa,.chip.perdida{background:var(--sunk);color:var(--muted);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.kv{display:grid;grid-template-columns:minmax(110px,34%) 1fr;gap:6px 12px;font-size:.92rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;display:grid;gap:8px;background:var(--surface)}
.empty b{font-family:var(--f-display)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--sunk)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.filters .field{min-width:150px;flex:1 1 150px}
.filters .field input,.filters .field select{padding:8px 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}

/* início */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.kpi{display:grid;gap:4px;padding-left:12px;border-left:2px solid var(--line)}
.kpi .n{font-family:var(--f-display);font-size:1.9rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.gov{display:grid;gap:8px;padding:14px;border-radius:8px;background:var(--sunk);align-content:start}
.gov .who{font-family:var(--f-display);font-size:1.15rem;font-weight:700}
.tl{display:grid;gap:12px}
.tl-item{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;font-size:.9rem}
.tl-item .d{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);padding-top:2px}

/* estados */
.carto{display:grid;gap:8px}
.carto button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:end;padding:14px 16px;border-radius:8px;color:#fff;min-height:64px}
.carto button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.carto .PR{background:var(--pr)} .carto .SC{background:var(--sc)} .carto .RS{background:var(--rs)}
.carto b{font-family:var(--f-display);font-size:1.3rem}
:root[data-theme="dark"] .carto button, :root:not([data-theme="light"]) .carto button{color:#fff}
.stat{display:grid;gap:2px}
.stat .n{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.org{display:grid;gap:12px}
.org-gov{justify-self:start;background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600}
.org-secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.sec{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px;background:var(--surface);border-left-width:4px}
.sec.entrada{border-left-color:var(--accent)} .sec.onda2{border-left-color:var(--signal)} .sec.monitorar{border-left-color:var(--gray)} .sec.sem{border-left-color:var(--line)}
.sec.mud{border-style:dashed}
.sec .nm{font-weight:600;font-size:.92rem}
.vinc{display:flex;flex-wrap:wrap;gap:4px}
.vinc span{font-size:.76rem;padding:1px 7px;border-radius:4px;background:var(--sunk)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.funnel{display:grid;gap:6px}
.frow{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-size:.88rem}
.fbar{height:22px;border-radius:4px;background:var(--accent);opacity:.85}
.frow:nth-child(2) .fbar{opacity:.7}.frow:nth-child(3) .fbar{opacity:.55}.frow:nth-child(4) .fbar{opacity:.42}
.ftrack{background:var(--sunk);border-radius:4px}

/* planos */
.plan{gap:14px}
.eixos{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.eixo{background:var(--sunk);border-radius:8px;padding:12px;display:grid;gap:6px;align-content:start;min-width:0}
.eixo ul{margin:0;padding-left:18px;font-size:.87rem;display:grid;gap:3px}
.gis{font-size:.86rem}
.cover td:last-child{white-space:nowrap}

/* notícias */
.headline-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.hl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start}
.hl.star{border-color:var(--signal);box-shadow:inset 0 3px 0 var(--signal)}
.hl h3 a{color:var(--ink);text-decoration:none} .hl h3 a:hover{text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.day{display:grid;grid-template-columns:96px 1fr;gap:12px}
.day > .d{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);padding-top:16px}
.day > .items{display:grid;gap:10px;min-width:0}
.reading{white-space:pre-wrap;font-size:.95rem}
.nl{display:grid;gap:10px}
.nl a{color:var(--ink);font-weight:600;text-decoration:none} .nl a:hover{text-decoration:underline}

/* dossiê */
.doc{display:grid;gap:0;max-width:960px}
.doc-cover{display:grid;gap:8px;padding-bottom:18px}
.doc-cover h2{font-size:1.9rem}
.doc section{display:grid;gap:10px;padding-block:18px;border-top:1px solid var(--line);min-width:0}
.doc section > h3{font-size:1.15rem}
.doc ul{margin:0;padding-left:20px;display:grid;gap:4px}
.reco{font-size:1rem;border-left:3px solid var(--accent);padding-left:12px;max-width:75ch}
.narr{display:grid;gap:6px;max-width:75ch}
.narr h4{margin-top:10px} .narr ul{margin:0;padding-left:20px;display:grid;gap:3px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.toolbar .field{flex:1 1 260px;min-width:0}
.note{color:var(--muted);font-style:italic;font-size:.88rem;max-width:80ch}
.mmd{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px}
.mmd svg{max-width:none;height:auto}

/* oportunidades */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:10px;padding:10px;display:grid;gap:8px;align-content:start;min-height:140px}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:6px;font-size:.88rem;min-width:0}
.card b{font-size:.92rem}
.card select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-size:.82rem;width:100%}
.opform{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opform .wide{grid-column:1/-1}

/* assistente */
.chat{display:grid;gap:12px;align-content:start}
.msg{max-width:78ch;padding:10px 14px;border-radius:12px;font-size:.94rem;display:grid;gap:6px;min-width:0}
.msg.u{justify-self:end;background:var(--ink);color:var(--surface);white-space:pre-wrap}
.msg.a{justify-self:start;background:var(--surface);border:1px solid var(--line)}
.msg.a ul{margin:0;padding-left:20px;display:grid;gap:3px}
.composer{display:grid;gap:8px}
.composer textarea{width:100%;min-height:76px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);resize:vertical}
.sugg{all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:.85rem;background:var(--surface)}
.sugg:hover{border-color:var(--accent);color:var(--accent)}

/* drawer */
.drawer{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end;background:rgba(10,20,22,.35)}
.drawer .sheet{width:min(600px,100%);height:100%;overflow-y:auto;background:var(--surface);padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:16px;align-content:start}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;z-index:30;font-size:.9rem}
.scatter text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.scatter .axis{stroke:var(--line)}
pre.code{background:var(--sunk);border-radius:8px;padding:12px;overflow-x:auto;font-family:var(--f-mono);font-size:.78rem;margin:0;max-height:260px}
.split-a{grid-template-columns:minmax(0,1fr) minmax(0,2.4fr);align-items:start}.split-b{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}.split-c{grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}
@media (max-width:860px){.split-a,.split-b,.split-c{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.day{grid-template-columns:1fr}.day > .d{padding-top:0}.frow{grid-template-columns:110px 1fr 40px}.kv{grid-template-columns:1fr}.gres button{grid-template-columns:minmax(0,1fr) auto}.gres .t{display:none}.tl-item{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.panel,.hl,.navbtn{transition:border-color .15s,background-color .15s}}
</style>

<div id="login">
  <form class="login-card" id="loginForm" autocomplete="on">
    <svg class="contour" viewBox="0 0 400 64" preserveAspectRatio="none" aria-hidden="true">
      <rect width="400" height="64" fill="var(--sunk)"/>
      <path d="M0 50 C60 30 110 58 170 38 S280 14 330 30 S390 44 400 36" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity=".9"/>
      <path d="M0 40 C70 20 120 46 180 28 S290 6 340 20 S392 32 400 26" fill="none" stroke="var(--accent)" stroke-width="1" opacity=".55"/>
      <path d="M0 30 C80 12 130 34 190 18 S300 0 350 10 S394 20 400 16" fill="none" stroke="var(--accent)" stroke-width="1" opacity=".3"/>
    </svg>
    <div class="label">Imagem Geosistemas · Carteira Sul</div>
    <h1>Território Sul</h1>
    <p class="muted">Hub comercial de Estados e Municípios do Paraná, Santa Catarina e Rio Grande do Sul: dossiês, planos de governo, radar de notícias e oportunidades.</p>
    <div class="field"><label for="lgUser">Usuário</label><input id="lgUser" name="username" autocomplete="username" required></div>
    <div class="field"><label for="lgPass">Senha</label><input id="lgPass" name="password" type="password" autocomplete="current-password" required></div>
    <div class="err" id="lgErr" role="alert"></div>
    <button class="btn" type="submit">Entrar</button>
  </form>
</div>

<div id="app" hidden>
  <div class="shell">
    <aside class="side" aria-label="Navegação">
      <div class="side-brand"><b>Território Sul</b><span class="label">Imagem Geosistemas · Carteira Sul</span></div>

      db.collection(c).onSnapshot(s=>{S.data[c]=s.docs.map(d=>Object.assign({_id:d.id},d.data()));queueRender()},err=>{if(c==='municipios'&&!S.data.municipios.length){S.db=null;useSnap()}else if(err&&err.code==='revoked')setDb(false,'acesso aos dados encerrado')})});

    db.doc('regional/plano').onSnapshot(d=>{S.data.regional=d.exists?d.data():null;queueRender()},()=>{});
  });
  W.use('user').then(async u=>{S.user=u;if(u){let c=null;try{c=await u.can('data.write')}catch(e){}S.canWrite=c;queueRender()}});
  W.use('sample').then(async s=>{S.sample=s;if(s){try{const l=await s.limits();S.tools=!!(l&&l.tools)}catch(e){}}queueRender()});
  W.use('downloads').then(d=>{S.dl=d;queueRender()});
}

function munFiltered(){const f=S.f.mun;let l=S.data.municipios.filter(ufOk);

  if(f.classe)l=l.filter(m=>m.classe===f.classe);if(f.ader)l=l.filter(m=>(m.aderencia||'')===f.ader);if(f.eixo)l=l.filter(m=>(m.eixo||'')===f.eixo);
  const o=f.ordem;l.sort((a,b)=>o==='pop'?(num(b.populacao)||0)-(num(a.populacao)||0):o==='nome'?String(a.nome).localeCompare(String(b.nome)):byNota(a,b));return l}

function munResults(){const l=munFiltered();

  <div class="panel"><h3>Matriz de priorização</h3><p class="muted" style="font-size:.85rem">Nota ponderada (eixo vertical) por população (eixo horizontal, escala log). Toque em um ponto para abrir a ficha.</p>${scatter(l)}</div></div>`}
function scatter(l){const pts=l.filter(m=>num(m.nota)!=null&&num(m.populacao)>0);if(!pts.length)return '<p class="muted">Sem população e nota suficientes para o gráfico.</p>';
  const W=360,H=240,P={l:34,r:12,t:12,b:30};const lg=pts.map(m=>Math.log10(num(m.populacao)));let x0=Math.floor(Math.min(...lg)),x1=Math.ceil(Math.max(...lg));if(x1===x0)x1++;
  const X=v=>P.l+(Math.log10(v)-x0)/(x1-x0)*(W-P.l-P.r),Y=v=>P.t+(5-v)/4*(H-P.t-P.b);
  const col={A:'var(--accent)',B:'var(--signal)',C:'var(--gray)'};let ticks='';for(let e=x0;e<=x1;e++){const v=Math.pow(10,e);ticks+=`<line class="axis" x1="${X(v)}" x2="${X(v)}" y1="${P.t}" y2="${H-P.b}"/><text x="${X(v)}" y="${H-12}" text-anchor="middle">${v>=1e6?(v/1e6)+' mi':(v/1e3)+' mil'}</text>`}
  let yt='';[1,2,3,4,5].forEach(v=>{yt+=`<line class="axis" x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${P.l-8}" y="${Y(v)+3}" text-anchor="end">${v}</text>`});
  return `<div style="overflow-x:auto"><svg class="scatter" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:100%;min-width:300px" role="img" aria-label="Nota por população">${yt}${ticks}<line class="axis" x1="${P.l}" x2="${W-P.r}" y1="${Y(3)}" y2="${Y(3)}" stroke-dasharray="4 3" style="stroke:var(--muted)"/>${pts.map(m=>`<g data-mun="${esc(m._id)}" style="cursor:pointer"><circle cx="${X(num(m.populacao))}" cy="${Y(Math.min(5,Math.max(1,num(m.nota))))}" r="6" fill="${col[m.classe]||'var(--gray)'}" fill-opacity=".85" stroke="var(--surface)" stroke-width="1.5"><title>${esc(m.nome)} — nota ${fmtNota(m.nota)}</title></circle></g>`).join('')}</svg></div><div class="legend"><span><i style="background:var(--accent)"></i>A</span><span><i style="background:var(--signal)"></i>B</span><span><i style="background:var(--gray)"></i>C</span><span>linha tracejada: nota 3, mínimo para classe A</span></div>`}
function munDrawer(id){const m=S.data.municipios.find(x=>x._id===id);if(!m)return;const k='M:'+id,est=Array.isArray(m.estrutura)?m.estrutura:[];

function planos(){

function fichaKv(m){const est=Array.isArray(m.estrutura)?m.estrutura:[];

  const input=`Você apoia a equipe da Imagem Geosistemas (distribuidora Esri/ArcGIS no Brasil) na descoberta com governos estaduais e municípios da Região Sul.\nAbaixo está o dossiê estratégico da conta "${doc.title}", montado com o "Super Prompt Comercial — Estados e Municípios da Região Sul". Siga as regras do prompt: use APENAS o que está no dossiê; não invente nem deduza nomes, valores, datas, sistemas ou contratos; não apresente compromisso político como fato; não estime licenças, valores, receita ou pipeline; não atribua status comercial; não force ArcGIS onde a aderência é baixa, e diga isso com objetividade. Quando faltar evidência, escreva "a confirmar em descoberta".\nEscreva em português do Brasil, em Markdown simples (títulos com "## " e listas com "- "), até 450 palavras, nesta ordem:\n## Primeiro movimento (5W1H)\n(a porta de entrada mais natural: o quê, por quê, quem, onde, quando, como, com a agenda e a evidência)\n## Perguntas de descoberta\n(6 a 8, ligadas às lacunas e evidências críticas do dossiê)\n## Como a geoinformação entra\n(por porta de entrada; "não se aplica ainda" quando for o caso)\n## Evidências a confirmar antes de levar à gestão\n(até 3)\n## Risco do ciclo\n(uma ou duas frases)\n\nDOSSIÊ:\n${toMd(doc).slice(0,90000)}`;
  try{const r=await S.sample(input,{signal:ctl.signal,cache:false,onText:({text})=>{S.narr.text=text;const el=document.getElementById('narrLive');if(el)el.innerHTML=md(text)}});
    S.narr.text=r.text;if(canW()){try{await S.db.doc('dossies/'+dosId(k)).set({conta_key:k,conta:doc.title,narrativa:r.text,gerado_em:new Date().toISOString()});toast('Apoio à descoberta gravado')}catch(e){toast(writeErr(e))}}

const STATUS={aguardando:'Aguardando estudo',estudo:'Em estudo',estudado:'Estudado'};
function entList(){const l=S.data.entidades.filter(ufOk).sort((a,b)=>String(b.criado_em).localeCompare(String(a.criado_em)));
  if(!l.length)return emptyBox('Nada incluído ainda','Inclua um município ou uma secretaria de Estado para gerar o prompt de aprofundamento e ligar o monitoramento no radar.');
  return `<div class="tbl"><table><thead><tr><th>Item</th><th>UF</th><th>Status</th><th>Radar</th><th></th></tr></thead><tbody>${l.map(e=>`<tr><td><b>${esc(e.nome)}</b><br><span class="muted" style="font-size:.8rem">${e.tipo==='municipio'?'Município':'Órgão estadual'}${e.motivo?' · '+esc(e.motivo):''}</span></td><td>${ufChip(e.uf)}</td><td>${S.canWrite===false?esc(STATUS[e.status]||e.status):`<select data-st="${esc(e._id)}" aria-label="Status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${e.status===k?'selected':''}>${v}</option>`).join('')}</select>`}</td><td>${e.monitorar?'Ligado':'Desligado'}</td><td><div class="row"><button class="btn small ghost" data-prompt="${esc(e._id)}">Copiar prompt</button>${S.canWrite===false?'':`<button class="btn small ghost" data-del="${esc(e._id)}">${S.confirmDel===e._id?'Confirmar remoção':'Remover'}</button>`}</div></td></tr>`).join('')}</tbody></table></div>`}
const SCHEMA=`{
  "uf": "PR | SC | RS",
  "data_corte": "AAAA-MM-DD",
  "estado": {
    "perfil": "frase", "estudo_status": "concluido",
    "funil_estadual": {"inventario": 0, "aderencia": 0, "priorizados": 0},
    "funil_municipal": {"universo": 0, "porte": 0, "agenda": 0, "aderencia": 0, "A": 0, "B": 0, "C": 0},
    "portas_entrada": [{"orgao": "sigla", "tipo_porta": "Direta | Indireta | Transversal | Financiamento | Normativa | Relacionamento | A investigar",
      "agenda": "", "dor": "", "dono_dor": "", "entrada_gis": "", "pipe": "", "horizonte": "2027 S1", "ponte": "", "onda": 1, "nota_pipe": 0.0, "fonte": "https://…"}],
    "resumo": {"situacao_pos_eleicao": "", "mudancas_estrutura": "", "perfil_estrategico": "",
      "agendas_prioritarias": [], "projetos_ti": [], "maturidade_ide": "", "orgaos_entrada": [],
      "papel_arcgis": "", "ponte_municipios": "", "municipios_a": [], "municipios_b": [],
      "efeito_ciclo": "", "evidencias_criticas": [], "principal_risco": "", "confianca": "",
      "recomendacao": "até 150 palavras"}
  },
  "orgaos": [{"nome": "", "sigla": "", "tipo": "Secretaria | Autarquia | Fundação | Estatal | SSA | Coordenação",
    "vinculacao": "sigla da secretaria supervisora", "competencia": "", "dirigente": "",
    "mudanca_2027": "Sem alteração | Anunciada | Publicada", "categoria": "entrada | onda2 | monitorar",
    "aderencia": "Alta | Média | Baixa", "nota": 0.0, "fonte": "https://…", "data_fonte": "AAAA-MM-DD"}],
  "agendas": [{"orgao": "sigla", "titulo": "", "tipo": "Programa | Obra | Financiamento | Projeto de TI | Plano | Licitação | Contrato",
    "horizonte": "", "valor": "somente se comprovado", "ti": true, "vinculo_territorial": "Sim | Não | A validar",
    "classificacao": "", "efeito_ciclo": "Acelerar | Manter | Aguardar | Proteger", "fonte": "https://…"}],
  "municipios": [{"nome": "", "regiao": "região geográfica intermediária", "populacao": 0, "ano_pop": 2025,
    "regic": "", "receita": "", "perfil": "", "agenda": "", "projetos_ti": "", "maturidade": "",
    "programas_estaduais": "", "aderencia": "Alta | Média | Baixa", "eixo": "", "modulo": "", "papel": "",
    "secretaria_entrada": "", "interlocutor": "", "efeito_polo": "", "efeito_ciclo": "", "evidencia_critica": "",
    "nota": 0.0, "classe": "A | B | C", "confianca": "", "fonte": "https://…",
    "estrutura": [{"nome": "", "relevancia": "Alta | Média | Baixa", "competencia": ""}],
    "portas_entrada": [{"orgao": "", "tipo_porta": "", "agenda": "", "dor": "", "entrada_gis": "", "pipe": "", "ponte": "", "nota_pipe": 0.0, "fonte": "https://…"}]}],
  "planos": [${PLANO_SCHEMA}],
  "noticias": [{"data": "AAAA-MM-DD", "titulo": "", "resumo": "", "fonte": "", "url": "https://…", "entidade": "",
    "tema": "transicao | estrutura | programa | investimento | tecnologia | desafio | eleicao",
    "relevancia": "alta | media | baixa", "destaque": false, "gancho_gis": ""}],
  "regional": {"tese": "", "ondas": [{"onda": "Onda 1 · 2027 S1", "contas": [], "marco": ""}],
    "teses_verticais": [], "riscos": [], "indicadores": [], "decisoes": []}
}`;
function incluir(){const w=S.canWrite!==false;const ip=S.importPreview;
  return `<div class="head"><div><div class="label">Composição do território</div><h2>Incluir e importar</h2></div><p>Inclua um município ou uma secretaria fora do ranking, gere o prompt de aprofundamento e importe os resultados dos estudos, planos de governo e notícias para alimentar todo o hub.</p></div>
  <div class="grid g2">
   <form class="panel" id="entForm"><h3>Incluir município ou órgão estadual</h3>
    <div class="row"><label class="row" style="gap:6px"><input type="radio" name="tipo" value="municipio" checked> Município</label><label class="row" style="gap:6px"><input type="radio" name="tipo" value="orgao"> Secretaria ou órgão estadual</label></div>
    <div class="grid" style="grid-template-columns:110px minmax(0,1fr)"><div class="field"><label class="label" for="eUf">UF</label><select id="eUf">${Object.keys(UFS).map(u=>`<option ${S.uf===u?'selected':''}>${u}</option>`).join('')}</select></div><div class="field"><label class="label" for="eNome">Nome</label><input id="eNome" required placeholder="Ex.: Chapecó ou Secretaria de Infraestrutura"></div></div>
    <div class="field"><label class="label" for="eMot">Por que incluir</label><input id="eMot" placeholder="Ex.: revisão do Plano Diretor anunciada"></div>
    <div class="field"><span class="label">Eixos de interesse</span><div class="chips">${EIXOS.map((x,i)=>`<label class="chip" style="cursor:pointer;font-weight:500"><input type="checkbox" name="eixo" value="${esc(x)}" id="ex${i}"> ${esc(x)}</label>`).join('')}</div></div>
    <label class="row" style="gap:6px"><input type="checkbox" id="eMon" checked> Monitorar no radar de notícias</label>
    <div class="row"><button class="btn" type="submit" ${w?'':'disabled'}>Incluir</button><button class="btn ghost" type="button" id="ePrompt">Só copiar o prompt</button></div>
    ${w?'':'<p class="muted" style="font-size:.85rem">Seu acesso é de leitura. Peça ao responsável para incluir itens.</p>'}
   </form>
   <div class="panel"><h3>Importar resultado do estudo</h3><p class="muted" style="font-size:.9rem">Cole o bloco JSON que o prompt entrega ao final (seção 16), ou o JSON do prompt de plano de governo. Itens com o mesmo nome são atualizados, sem duplicar.</p>
    <div class="field"><label class="label" for="impTxt">JSON do estudo</label><textarea id="impTxt" style="min-height:140px" placeholder='{"uf": "SC", "orgaos": [...], "municipios": [...], "planos": [...]}'></textarea></div>
    <div class="row"><button class="btn ghost" type="button" id="impCheck">Validar</button><button class="btn" type="button" id="impGo" ${ip&&ip.ok&&w?'':'disabled'}>Importar</button><button class="btn ghost small" type="button" id="schemaCopy">Copiar formato esperado</button></div>
    <div id="impOut">${ip?`<p class="${ip.ok?'':'err'}" style="font-size:.9rem">${esc(ip.msg)}</p>`:''}</div>
    <details><summary class="label" style="cursor:pointer">Ver formato esperado</summary><pre class="code">${esc(SCHEMA)}</pre></details>
   </div>
  </div>
  <div class="panel"><h3>Itens incluídos</h3><div id="results">${entList()}</div></div>`}
function parseImport(t){let j;try{const s=t.indexOf('{'),e=t.lastIndexOf('}');j=JSON.parse(t.slice(s,e+1))}catch(e){return{ok:false,msg:'O texto não é um JSON válido. Copie só o bloco entre chaves.'}}
  const reg=j.regional&&typeof j.regional==='object';if(!UFS[j.uf]&&!reg)return{ok:false,msg:'Informe "uf" como PR, SC ou RS (ou envie o bloco "regional" do Modo 3).'};
  const c=k=>Array.isArray(j[k])?j[k].filter(x=>x&&(x.nome||x.titulo||x.entidade)).length:0;
  return{ok:true,j,msg:`Pronto para importar${UFS[j.uf]?' em '+UFS[j.uf]:''}: ${c('orgaos')} órgãos, ${c('agendas')} agendas, ${c('municipios')} municípios, ${c('planos')} planos, ${c('noticias')} notícias${j.estado?', quadro do Estado':''}${j.estado&&Array.isArray(j.estado.portas_entrada)?', '+j.estado.portas_entrada.length+' portas de entrada':''}${reg?', plano regional':''}.`}}
async function doImport(){const p=S.importPreview;if(!p||!p.ok||!S.db)return;const j=p.j,u=j.uf,db=S.db;const btn=$('#impGo');btn.disabled=true;btn.textContent='Importando…';
  const now=new Date().toISOString();let n=0;
  try{
    if(UFS[u]){
      if(j.estado){const cur=S.data.estados[u]||{};await db.doc('estados/'+u).set(Object.assign({},cur,j.estado,{data_corte:j.data_corte||cur.data_corte||'',atualizado_em:now}));n++}
      for(const o of (j.orgaos||[]).filter(x=>x&&x.nome)){await db.doc('orgaos/'+u+'-'+slug(o.sigla||o.nome)).set(Object.assign({},o,{uf:u,atualizado_em:now}));n++}
      for(const a of (j.agendas||[]).filter(x=>x&&x.titulo)){await db.doc('agendas/'+u+'-'+slug(a.orgao+'-'+a.titulo)).set(Object.assign({},a,{uf:u,atualizado_em:now}));n++}
      for(const m of (j.municipios||[]).filter(x=>x&&x.nome)){await db.doc('municipios/'+u+'-'+slug(m.nome)).set(Object.assign({},m,{uf:u,atualizado_em:now}));n++;
        const ent=S.data.entidades.find(e=>e.tipo==='municipio'&&e.uf===u&&slug(e.nome)===slug(m.nome));if(ent)await db.doc('entidades/'+ent._id).update({status:'estudado'})}
      for(const pl of (j.planos||[]).filter(x=>x&&(x.entidade||x.titulo))){const esc0=pl.escopo==='municipio'?'municipio':'estado';await db.doc('planos/'+u+'-'+slug((pl.entidade||GOV[u])+'-'+(pl.tipo||pl.titulo||'plano'))).set(Object.assign({},pl,{escopo:esc0,entidade:pl.entidade||GOV[u],uf:u,atualizado_em:now}));n++}
      for(const x of (j.noticias||[]).filter(x=>x&&x.titulo)){const uu=UFS[x.uf]?x.uf:u;await db.doc('noticias/'+uu+'-'+(x.data||today())+'-'+slug(x.titulo).slice(0,48)).set(Object.assign({coletado_em:today()},x,{uf:uu}));n++}
    }
    if(j.regional&&typeof j.regional==='object'){await db.doc('regional/plano').set(Object.assign({},j.regional,{atualizado_em:now}));n++}
    S.importPreview=null;toast(`Importado: ${n} registros gravados`);render();
  }catch(e){btn.disabled=false;btn.textContent='Importar';$('#impOut').innerHTML=`<p class="err">${e&&e.code==='quota_exceeded'?'O banco atingiu o limite de registros. Remova itens antigos e tente de novo.':e&&e.code==='invalid_argument'?'Seu acesso não permite gravar, ou um item excede o tamanho máximo.':'A importação parou no meio ('+n+' registros gravados). Tente importar de novo; itens repetidos são atualizados.'}</p>`}}

/* ---------- bind ---------- */
function bind(){const on=(id,ev,fn)=>{const el=$('#'+id);el&&el.addEventListener(ev,fn)};
  $('#main').querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go,b.dataset.uf)));
  on('agTi','change',e=>{S.f.ag.ti=e.target.checked;render()});
  [['fq','q','input'],['fc','classe','change'],['fa','ader','change'],['fe','eixo','change'],['fo','ordem','change']].forEach(([id,k,ev])=>on(id,ev,e=>{S.f.mun[k]=e.target.value;$('#results').innerHTML=munResults()}));
  [['nq','q','input'],['nt','tema','change'],['nr','rel','change'],['ns','so','change']].forEach(([id,k,ev])=>on(id,ev,e=>{S.f.news[k]=e.target.value;$('#results').innerHTML=newsResults()}));
  [['pe','escopo'],['pa','ader']].forEach(([id,k])=>on(id,'change',e=>{S.f.plan[k]=e.target.value;render()}));
  on('pq','change',e=>{S.f.plan.q=e.target.value;render()});
  [['ptq','q','input'],['ptt','tipo','change'],['pte','esfera','change'],['pto','onda','change']].forEach(([id,k,ev])=>on(id,ev,e=>{S.f.porta[k]=e.target.value;$('#results').innerHTML=portasResults()}));
  on('readBtn','click',genReading);
  on('dsConta','change',e=>{S.conta=e.target.value;ls('ts_conta',S.conta);render()});
  on('narrGo','click',genNarr);on('narrStop','click',()=>{S.narr.ctl&&S.narr.ctl.abort()});
  on('dsMd','click',()=>{const d=dossierModel(S.conta);if(d)copy(toMd(d,true))});
  on('dsDlMd','click',()=>{const d=dossierModel(S.conta);if(d)saveFile('Dossiê '+d.title+'.md',toMd(d,true))});
  on('dsDlHtml','click',()=>{const d=dossierModel(S.conta);if(d)saveFile('Dossiê '+d.title+'.html',toHtmlFile(d))});
  on('dsPrompt','click',()=>copy($('#dsPromptTxt').value));
  on('opDet','toggle',e=>{S.op.open=e.target.open;if(!S.op.open)S.op.prefill=null});
  on('opForm','submit',async e=>{e.preventDefault();if(!canW()){toast('Os dados não estão disponíveis para gravação nesta visualização');return}
    const k=$('#opConta').value,titulo=$('#opTitulo').value.trim();if(!titulo){toast('Descreva a oportunidade');return}
    const c=contaOf(k),now=new Date().toISOString(),id=slug(k+'-'+titulo).slice(0,60)+'-'+Date.now().toString(36);
    const d={conta_key:k,conta:c?c.label:k,uf:c?c.uf:'',titulo,eixo:$('#opEixo').value,proximo_passo:$('#opPasso').value.trim(),data_proximo:$('#opData').value,origem:$('#opOrigem').value.trim(),estagio:'identificada',criado_em:now,atualizado_em:now};
    const vv=num($('#opValor').value);if(vv!=null)d.valor=vv;
    try{await S.db.doc('oportunidades/'+id).set(d);S.op={prefill:null,open:false,confirm:null};toast('Oportunidade registrada');render()}catch(err){toast(writeErr(err))}});
  const ci=$('#chatIn');if(ci){ci.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat(ci.value)}})}
  on('chatSend','click',()=>sendChat(($('#chatIn')||{}).value));on('chatStop','click',()=>{S.chat.ctl&&S.chat.ctl.abort()});on('chatClear','click',()=>{S.chat.turns=[];render()});
  $('#main').querySelectorAll('[data-sugg]').forEach(b=>b.addEventListener('click',()=>{if(S.sample&&!S.chat.off)sendChat(SUGG[+b.dataset.sugg]);else toast('O Claude não está disponível nesta visualização')}));
  const ef=$('#entForm');if(ef){
    const read=()=>({tipo:ef.querySelector('input[name=tipo]:checked').value,uf:$('#eUf').value,nome:$('#eNome').value.trim(),motivo:$('#eMot').value.trim(),eixos:[...ef.querySelectorAll('input[name=eixo]:checked')].map(x=>x.value),monitorar:$('#eMon').checked});
    ef.addEventListener('submit',async e=>{e.preventDefault();const d=read();if(!d.nome){toast('Informe o nome');return}if(!S.db){toast('Os dados não estão disponíveis nesta visualização');return}
      const id=d.uf+'-'+(d.tipo==='municipio'?'m':'o')+'-'+slug(d.nome);
      try{await S.db.doc('entidades/'+id).set(Object.assign(d,{status:'aguardando',criado_em:new Date().toISOString()}));toast(d.nome+' incluído');ef.reset()}catch(err){toast(err&&err.code==='invalid_argument'?'Seu acesso não permite incluir itens':'Não foi possível incluir agora; tente de novo')}});
    on('ePrompt','click',()=>{const d=read();if(!d.nome){toast('Informe o nome');return}copy(promptFor(d))});
  }
  on('impCheck','click',()=>{S.importPreview=parseImport($('#impTxt').value);const t=$('#impTxt').value;render();$('#impTxt').value=t});
  on('impGo','click',doImport);
  on('schemaCopy','click',()=>copy(SCHEMA));
  if(document.querySelector('#main .mmd'))renderMermaid();
  if(S.tab==='planos'&&S.planFocus){const el=document.querySelector(`[data-plan="${CSS.escape(S.planFocus)}"]`);S.planFocus=null;if(el)requestAnimationFrame(()=>el.scrollIntoView({block:'start'}))}
}
function bindOnce(){const m=$('#main');
  m.addEventListener('click',e=>{if(e.target.closest('[data-act],[data-op]'))return;const r=e.target.closest('[data-mun]');if(r)munDrawer(r.dataset.mun)});
  m.addEventListener('keydown',e=>{if(e.key==='Enter'){const r=e.target.closest('tr[data-mun]');if(r)munDrawer(r.dataset.mun)}});
  m.addEventListener('change',async e=>{const s=e.target.closest('[data-st]');if(s&&S.db){try{await S.db.doc('entidades/'+s.dataset.st).update({status:s.value});toast('Status atualizado')}catch(err){toast('Não foi possível atualizar o status')}}
    const o=e.target.closest('[data-opst]');if(o&&S.db){try{await S.db.doc('oportunidades/'+o.dataset.opst).update({estagio:o.value,atualizado_em:new Date().toISOString()});toast('Estágio: '+stageName(o.value))}catch(err){toast(writeErr(err))}}});
  m.addEventListener('click',async e=>{const p=e.target.closest('[data-prompt]');if(p){const en=S.data.entidades.find(x=>x._id===p.dataset.prompt);if(en)copy(promptFor(en))}
    const d=e.target.closest('[data-del]');if(d&&S.db){if(S.confirmDel!==d.dataset.del){S.confirmDel=d.dataset.del;$('#results').innerHTML=entList();return}S.confirmDel=null;try{await S.db.doc('entidades/'+d.dataset.del).delete();toast('Removido')}catch(err){toast('Não foi possível remover')}}
    const od=e.target.closest('[data-opdel]');if(od&&S.db){if(S.op.confirm!==od.dataset.opdel){S.op.confirm=od.dataset.opdel;render();return}S.op.confirm=null;try{await S.db.doc('oportunidades/'+od.dataset.opdel).delete();toast('Oportunidade removida')}catch(err){toast(writeErr(err))}}});
}
bindOnce();
if(ss('ts_auth')==='1')enter();
})();
</script>
